name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # ── 0. Detect which areas of the repo the PR touches ────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'noxfile.py'
              - 'mypy.ini'
              - 'ruff.toml'
              - '.flake8'
              - 'pylintrc'
              - 'vulture_whitelist.py'
              - '.github/workflows/pr.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'CHANGELOG.md'
              - 'src/**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/pr.yml'

  # ── 1. Conventional Commits PR-title lint (primary gate for squash merges) ──
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types mirror pyproject.toml commitizen config
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            Subject must start lowercase and not end with a period.
  # ── 2. Code quality (Python 3.12 only) ──────────────────────────────────────
  quality:
    name: Quality gates (3.12)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Syntax check
        run: nox -s check_syntax
      - name: Lint
        run: nox -s lint
      - name: Type check
        run: nox -s check_types
      - name: Import analysis
        run: nox -s necessary_imports
      - name: Dead code
        run: nox -s dead_code
      - name: Duplicate code
        run: nox -s duplicates
      - name: Cyclic imports
        run: nox -s cyclic_imports
  # ── 3. Tests — multi-Python matrix ──────────────────────────────────────────
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Windows support is still experimental (POSIX-first project); keep it
    # non-blocking so it provides signal without gating merges.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # Use bash everywhere; on Windows this is Git Bash (POSIX-ish) which the CLI
    # targets, rather than PowerShell/cmd.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # macOS is a supported target (POSIX); smoke-test the primary Python.
          - os: macos-latest
            python-version: "3.12"
          # Windows via Git Bash; smoke-test the primary Python.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Unit tests
        run: nox -s tests-${{ matrix.python-version }}
  # ── 4. Integration tests (single Python — see quality-gates.md) ─────────────
  integration:
    name: Integration tests (3.12)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Integration tests
        run: nox -s integration
  # ── 5. CLI cold-start performance budgets ────────────────────────────────────
  performance:
    name: Performance budgets (3.12)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Performance budgets
        run: nox -s performance
  # ── 6. Docs build (strict) ───────────────────────────────────────────────────
  docs-build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # mike needs the full history to list existing versions
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install nox
        run: uv tool install nox
      - name: Build docs
        run: nox -s docs
  # ── 7. Docs preview (only when docs inputs changed) ──────────────────────────
  docs-preview:
    name: Docs preview
    runs-on: ubuntu-latest
    needs: [changes, docs-build]
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install docs deps
        run: uv pip install -e ".[docs]" --system
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build docs for preview
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict --site-dir site
      - name: Deploy docs preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ── 8. Single required check ────────────────────────────────────────────────
  # Skipped jobs (and unexpanded matrix names) can leave required checks pending;
  # mark only this job as required in branch protection.
  pr-ok:
    name: PR checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-title, changes, quality, tests, integration, performance, docs-build, docs-preview]
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
